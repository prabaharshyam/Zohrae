<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zohraé launch film</title>
    <style>
      @font-face { font-family: "Bodoni Moda"; font-style: normal; font-weight: 400 900; src: url(fonts/bodoni.woff2) format("woff2"); }
      @font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400 900; src: url(fonts/bodoni-italic.woff2) format("woff2"); }
      @font-face { font-family: "Jost"; font-style: normal; font-weight: 100 900; src: url(fonts/jost.woff2) format("woff2"); }
      @font-face { font-family: "Pinyon Script"; font-style: normal; font-weight: 400; src: url(fonts/pinyon.woff2) format("woff2"); }

      :root {
        --night: #120c09; --espresso: #2a1d15; --ivory: #f6efe4; --gold: #c0823a; --glow: #ffb869;
        --honey: #e8b04b; --blush: #f2d6cf; --terracotta: #b4472c; --marigold: #e7a535; --sage: #dde3d2;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--night); }
      body { font-optical-sizing: none; font-variation-settings: "opsz" 26; font-family: "Jost", sans-serif; color: var(--espresso); -webkit-font-smoothing: antialiased; }
      #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--night); }
      .layer { position: absolute; inset: 0; }
      .hide { opacity: 0; visibility: hidden; }
      .center { display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
      .display { font-family: "Bodoni Moda", serif; font-weight: 500; letter-spacing: -0.02em; line-height: 0.95; }
      .it { font-style: italic; }
      .label { font-family: "Jost"; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; }
      .script { font-family: "Pinyon Script", cursive; }
      .gold { color: var(--gold); }
      .mask { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 0.04em 0.08em; }
      .mask > span { display: inline-block; }
      img { display: block; }

      /* ---------- 1 · lights off */
      #glow { background: radial-gradient(closest-side, rgba(255, 196, 120, 0.95), rgba(255, 170, 80, 0.35) 45%, rgba(255, 150, 60, 0) 75%); width: 170vmax; height: 170vmax; left: 50%; top: 50%; position: absolute; transform: translate(-50%, -50%) scale(0); border-radius: 50%; }
      #s1-text { position: absolute; left: 0; right: 0; top: 18%; color: #f3e7d5; }
      #s1-text .a { font-size: 9vmin; }
      #s1-text .b { font-size: 6.2vmin; margin-top: 2vmin; opacity: 0.85; }
      #lamp1 { position: absolute; left: 50%; bottom: 14%; width: 46vmin; transform: translateX(-50%); }
      #lamp1 img { width: 100%; }
      #lamp1 .on { position: absolute; inset: 0; opacity: 0; filter: brightness(1.12) saturate(1.1); }
      #switch { position: absolute; width: 13vmin; height: 19vmin; border-radius: 2.4vmin; background: linear-gradient(160deg, #fffaf0, #e9dcc4); box-shadow: 0 2vmin 5vmin rgba(0,0,0,.45), inset 0 0 0 .3vmin rgba(255,255,255,.6); display: grid; place-items: center; }
      #switch .rocker { width: 6vmin; height: 10vmin; border-radius: 1.2vmin; background: linear-gradient(180deg, #fff 0%, #efe4d0 48%, #d9c9ab 52%, #f3eadb 100%); box-shadow: 0 .6vmin 1.2vmin rgba(60,40,20,.35); }
      #switch .screw { position: absolute; left: 50%; width: 1.4vmin; height: 1.4vmin; margin-left: -0.7vmin; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e9c27a, #9b6b25); }
      #flash { background: radial-gradient(closest-side, #fffaf0, #ffe2b0 60%, #ffcf85); opacity: 0; }

      /* ---------- 2 · reveal */
      #wordmark { width: 78vmin; }
      .landscape #wordmark { width: 62vmin; }
      #wordmark svg { width: 100%; overflow: visible; }
      #stamp { position: absolute; width: 30vmin; height: 30vmin; border-radius: 50%; background: var(--terracotta); color: #fff4e6; display: grid; place-items: center; box-shadow: 0 2vmin 4vmin rgba(120, 40, 20, 0.35); }
      #stamp .ring { position: absolute; inset: 0; }
      #stamp .big { font-family: "Bodoni Moda"; font-style: italic; font-weight: 700; font-size: 6.6vmin; line-height: 0.9; text-align: center; }
      #s2-url { font-size: 3.6vmin; margin-top: 5vmin; color: var(--espresso); }

      /* ---------- 3 · shelves */
      .shelf { display: flex; align-items: center; justify-content: center; }
      .portrait .shelf { flex-direction: column; gap: 6vh; padding-top: 2vh; }
      .portrait .shelf-title { font-size: 13.5vmin; }
      .portrait .shelf-title .label { font-size: 2.8vmin; }
      .landscape .shelf { flex-direction: row; gap: 4vw; padding: 0 7vw; }
      .shelf-title { font-size: 11vmin; }
      .portrait .shelf-title { text-align: center; }
      .landscape .shelf-title { flex: 0 0 40%; text-align: left; font-size: 10.5vmin; }
      .shelf-title .label { display: block; font-size: 2.3vmin; margin-bottom: 2.4vmin; color: var(--gold); }
      .items { position: relative; display: flex; align-items: flex-end; justify-content: center; }
      .landscape .items { flex: 1; }
      .lamps .item { height: 26vh; margin: 0 -2.5vmin; position: relative; }
      .portrait .lamps .item:nth-child(2) { margin-bottom: 9vh; }
      .landscape .lamps .item { height: 50vh; margin: 0 -1.5vmin; }
      .lamps .item img { height: 100%; }
      .lamps .item .on { position: absolute; inset: 0; opacity: 0; }
      .lamps .item .halo { position: absolute; left: 50%; top: 30%; width: 120%; aspect-ratio: 1; transform: translate(-50%, -50%) scale(0); border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 190, 110, 0.75), rgba(255, 170, 80, 0)); }
      .cut { height: 44vh; }
      .landscape .cut { height: 58vh; }
      .card { width: 28vmin; aspect-ratio: 3/4; border-radius: 2vmin; overflow: hidden; box-shadow: 0 2.4vmin 5vmin rgba(60, 35, 20, 0.28); border: 1vmin solid #fffaf2; background: #fffaf2; position: relative; }
      .card img { width: 100%; height: 100%; object-fit: cover; }
      .portrait .frames .card { width: 30vw; }
      .portrait .frames .items { flex-wrap: wrap; width: 100vw; row-gap: 9vh; }
      .portrait .frames .card:nth-child(3) { width: 44vw; }
      .frames .card { margin: 0 1vmin; transform-origin: 50% -10%; }
      .landscape .frames .card { width: 15vw; }
      .frames .nail { position: absolute; top: -3vmin; left: 50%; width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #8a6a43; transform: translateX(-50%); }
      .chip { position: absolute; left: 50%; bottom: -5.5vmin; transform: translateX(-50%); padding: 0.8vmin 2.4vmin; border-radius: 99px; background: var(--espresso); color: var(--ivory); font-size: 2.6vmin; letter-spacing: 0.2em; font-weight: 600; }
      .tumbler-wrap { position: relative; height: 52vh; }
      .landscape .tumbler-wrap { height: 64vh; }
      .tumbler-wrap img { height: 100%; }
      .tumbler-name { position: absolute; left: 0; right: 14%; top: 47%; text-align: center; font-size: 14vmin; color: #b9893f; }
      .landscape .tumbler-name { font-size: 12vmin; }
      .tumbler-name span { display: inline-block; clip-path: inset(0 100% 0 0); }
      .duo { display: flex; align-items: center; gap: 4vmin; }
      .duo .card { width: 40vw; }
      .landscape .duo .card { width: 26vmin; }
      .burst { position: absolute; z-index: 5; font-family: "Bodoni Moda"; font-style: italic; font-weight: 800; font-size: 9vmin; color: var(--terracotta); text-shadow: 0.6vmin 0.6vmin 0 #fff4e2; }
      .pill { position: absolute; z-index: 5; padding: 1.4vmin 3.4vmin; border-radius: 99px; background: #fffaf2; color: var(--espresso); font-family: "Pinyon Script"; font-size: 6vmin; box-shadow: 0 1.4vmin 3vmin rgba(60, 35, 20, 0.25); }

      /* ---------- 4 · more */
      #orbit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 1; }
      #orbit .o { position: absolute; width: 20vmin; aspect-ratio: 3/4; margin: -13.3vmin 0 0 -10vmin; border-radius: 1.6vmin; overflow: hidden; border: 0.7vmin solid #fffaf2; box-shadow: 0 1.6vmin 3vmin rgba(60, 35, 20, 0.25); background: #fffaf2; }
      #orbit .o img { width: 100%; height: 100%; object-fit: cover; }
      #orbit .o.cutout { border: 0; box-shadow: none; background: transparent; }
      #orbit .o.cutout img { object-fit: contain; }
      #more-text { font-size: 12vmin; z-index: 3; position: relative; padding: 3vmin 5vmin; border-radius: 6vmin; background: radial-gradient(closest-side, rgba(246,239,228,.95), rgba(246,239,228,.85) 70%, rgba(246,239,228,0)); text-shadow: 0 0 6vmin var(--ivory), 0 0 3vmin var(--ivory); }

      /* ---------- 5 · heart */
      #s5 { color: var(--ivory); }
      #s5 .l1 { font-size: 9vmin; }
      #s5 .l2 { font-size: 7vmin; margin-top: 1vmin; opacity: 0.9; }
      #s5 .l3 { font-size: 9vmin; margin-top: 6vmin; }
      #s5 .l3 .script { font-size: 15vmin; color: var(--glow); }

      /* ---------- 6 · offers */
      #rays { position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; background: repeating-conic-gradient(from 0deg, rgba(255, 245, 225, 0.22) 0deg 7deg, rgba(255, 245, 225, 0) 7deg 15deg); border-radius: 50%; }
      #offer-words { color: var(--espresso); }
      #offer-words .w { font-size: 21vmin; font-weight: 800; letter-spacing: -0.03em; line-height: 0.88; }
      #offer-words .w1 { font-family: "Jost"; font-weight: 800; font-style: normal; letter-spacing: 0.02em; font-size: 19vmin; }
      .landscape #offer-words .w { font-size: 20vmin; }
      .landscape #offer-words .w1 { font-size: 17vmin; }
      #offer-words .w2 { color: #fff7ea; text-shadow: 0.9vmin 0.9vmin 0 var(--terracotta); }
      #sticker { position: absolute; width: 27vmin; height: 27vmin; display: grid; place-items: center; }
      #sticker svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #sticker span { position: relative; font-family: "Bodoni Moda"; font-style: italic; font-weight: 700; color: #fff4e6; font-size: 4.6vmin; line-height: 0.95; text-align: center; transform: rotate(-8deg); }
      .offer-line { position: absolute; left: 6vw; right: 6vw; text-align: center; font-size: 5vmin; font-weight: 500; color: var(--espresso); }
      .offer-line b { font-weight: 700; }
      .floaty { position: absolute; }
      .floaty img { height: 100%; }

      /* ---------- 7 · order */
      #order-top { font-size: 9vmin; }
      #btn { position: relative; margin-top: 4vmin; padding: 2.6vmin 7vmin; border-radius: 99px; background: linear-gradient(180deg, #d59a4b, #b07330); color: #fffaf0; font-family: "Jost"; font-weight: 600; font-size: 7.4vmin; letter-spacing: 0.04em; box-shadow: 0 2vmin 4vmin rgba(150, 90, 30, 0.35), inset 0 0.4vmin 0 rgba(255, 255, 255, 0.3); }
      #ripple { position: absolute; left: 50%; top: 50%; width: 10vmin; height: 10vmin; margin: -5vmin 0 0 -5vmin; border-radius: 50%; border: 0.6vmin solid var(--gold); opacity: 0; }
      #cursor { position: absolute; width: 7vmin; filter: drop-shadow(0 0.6vmin 0.8vmin rgba(0,0,0,.3)); }
      #sign { margin-top: 6vmin; display: flex; flex-direction: column; align-items: center; gap: 2.4vmin; }
      #sign .tag { font-family: "Bodoni Moda"; font-style: italic; font-size: 6vmin; }
      #sign .ig { display: flex; align-items: center; gap: 1.6vmin; font-size: 3.8vmin; font-weight: 500; letter-spacing: 0.06em; }
      #sign .ig svg { width: 4.6vmin; height: 4.6vmin; }
      #lamp7 { position: absolute; width: 30vmin; }
      #lamp7 .halo { position: absolute; left: 50%; top: 32%; width: 160%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 190, 110, 0.55), rgba(255, 170, 80, 0)); }
      #lamp7 img { width: 100%; position: relative; }
      #mini-mark { width: 34vmin; margin-bottom: 1vmin; }

      /* ---------- confetti */
      #confetti i { position: absolute; left: 0; top: 0; display: block; border-radius: 0.3vmin; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bg" class="layer" style="background: var(--night)"></div>
      <div id="rays" class="hide"></div>
      <div id="glow"></div>

      <!-- 1 -->
      <section id="s1" class="layer">
        <div id="s1-text" class="center">
          <div class="display it a"><span class="mask"><span>Psst…</span></span></div>
          <div class="display b"><span class="mask"><span>it’s a little</span></span> <span class="mask"><span>dark in here.</span></span></div>
        </div>
        <div id="lamp1">
          <img class="off" src="../../public/products/aurelia/cutout-off.webp" />
          <img class="on" src="../../public/products/aurelia/cutout-on.webp" />
        </div>
        <div id="switch"><span class="screw" style="top: 1.6vmin"></span><span class="rocker"></span><span class="screw" style="bottom: 1.6vmin"></span></div>
      </section>

      <!-- 2 -->
      <section id="s2" class="layer center hide">
        <div id="wordmark"></div>
        <div id="s2-url" class="label">www.zohrae.in</div>
        <div id="stamp">
          <svg class="ring" viewBox="0 0 200 200">
            <defs><path id="circ" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0" /></defs>
            <text font-family="Jost" font-size="15" letter-spacing="6.4" fill="#fff4e6" font-weight="600"><textPath href="#circ">ZOHRAÉ · NOW OPEN · ZOHRAÉ · NOW OPEN ·</textPath></text>
          </svg>
          <div class="big">We’re<br />live!</div>
        </div>
      </section>

      <!-- 3: shelves (filled by scenes.js) -->
      <div id="shelves"></div>

      <!-- 4 -->
      <section id="s4" class="layer center hide">
        <div id="orbit"></div>
        <div id="more-text" class="display it">…and so<br /><span class="gold">much more!</span></div>
      </section>

      <!-- 5 -->
      <section id="s5" class="layer center hide">
        <div class="display l1"><span class="mask"><span>Designed &amp; handmade</span></span></div>
        <div class="display it l2"><span class="mask"><span>in India.</span></span></div>
        <div class="display l3"><span class="mask"><span>Made just for <span class="script">you</span></span></span></div>
      </section>

      <!-- 6 -->
      <section id="s6" class="layer center hide">
        <div class="floaty f1" style="height: 26vmin"><img src="../../public/products/nuvola/cutout-on.webp" /></div>
        <div class="floaty f2" style="height: 22vmin"><img src="../../public/products/marea/cutout.webp" /></div>
        <div class="floaty f3" style="height: 24vmin"><img src="../../public/products/rosalie/cutout-on.webp" /></div>
        <div class="floaty f4" style="height: 22vmin"><img src="../../public/products/giardino/cutout.webp" /></div>
        <div id="offer-words" class="center">
          <div class="w w1">LAUNCH</div>
          <div class="w display it w2">offers</div>
        </div>
        <div id="sticker">
          <svg viewBox="0 0 200 200"><polygon fill="#b4472c" points="" id="star" /></svg>
          <span>Limited<br />time!</span>
        </div>
        <div class="offer-line l1"></div>
        <div class="offer-line l2">Grab yours <b>before they’re gone!</b></div>
      </section>

      <!-- 7 -->
      <section id="s7" class="layer center hide">
        <div id="order-top" class="display it"><span class="mask"><span>Order now at</span></span></div>
        <div id="btn">zohrae.in<span id="ripple"></span></div>
        <div id="sign">
          <div id="mini-mark"></div>
          <div class="tag">Shine beyond.</div>
          <div class="ig">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none" /></svg>
            @zohrae.in
          </div>
        </div>
        <div id="lamp7"><span class="halo"></span><img src="../../public/products/aurelia/cutout-on.webp" /></div>
        <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2.5 19.5 12l-6.6 1.6 3.9 7.2-2.9 1.6-3.9-7.2L5.2 19.8Z" fill="#fff" stroke="#2a1d15" stroke-width="1.3" stroke-linejoin="round" /></svg>
      </section>

      <div id="flash" class="layer"></div>
      <div id="confetti" class="layer"></div>
    </div>

    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="wordmark.js"></script>
    <script src="scenes.js"></script>
  </body>
</html>
